`!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //string
        let name = "Pranil Tanaji Malekar";
        console.log(name);
        console.log(typeof name);
    
        //number
        let age = 26;
        console.log(age);
        console.log(typeof age);
      
        //number
        let phone = 7507411313n;
        console.log(phone);
        console.log(typeof phone);
    
        //bigint
        let phoneNumber = 7507411313;
        console.log(phoneNumber);
        console.log(typeof phoneNumber);    

        //boolean
        let ans = false;
        console.log(ans);
        console.log(typeof ans);

        //undefined
        console.log("abc");
        console.log(typeof "abc");

    </script>

</body>
</html>
