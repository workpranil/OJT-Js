<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 <script>
    let a = 20;
     b= 30;
     c= 40;

    //arithmetic operator
    console.log("add :" + (b+c));
    console.log("sub :" + (b-c));
    console.log("mul :" + (b*c));
    console.log("div :" + (b/c));
    console.log("Increment : " +(++b));
    console.log("Decrement : " +(--c));
    
    //comparison operator
    console.log("equal : " + (a==a)); 
    console.log("notequal : " + (a!=b));
    console.log("greater : " + (a>b));
    console.log("less :" + (a<b));
    console.log("greaterequal :" + (a>=b))
    console.log("lessequal :" + (a<=b));
    
    //assignment operator
    console.log("add assignment :" + (a+=b));
    console.log("sub assignment :" + (a-=b));
    console.log("mul assignment :" + (a*=b));
    console.log("div assignment :" + (a/=b));

    //pre and post increment 
    console.log(a++);
    console.log(a);
    console.log(b--);
    console.log(b);

    //logical operator
    console.log("and  : " + (a>b && b>c));
    console.log("or  : " + (a>b || b>c));
    console.log("not : " + !(a>b));


    </script>    
</body>
</html>
